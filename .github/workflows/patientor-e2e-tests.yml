name: Patientor E2E Tests

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
      
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11

    - name: Install patientor backend dependencies
      working-directory: ./patientor/backend
      run: |
        pnpm install --strict-peer-dependencies=false || true
        pnpm approve-builds --all
        pnpm install

    - name: Start patientor backend
      working-directory: ./patientor/backend
      run: pnpm start &

    - name: Install patientor frontend dependencies
      working-directory: ./patientor/frontend
      run: |
        pnpm install --strict-peer-dependencies=false || true
        pnpm approve-builds --all
        pnpm install

    - name: Build patientor frontend
      working-directory: ./patientor/frontend
      run: pnpm run build

    - name: Start patientor frontend preview
      working-directory: ./patientor/frontend
      run: pnx vite preview --port 5173 &

    - name: Install e2e test dependencies
      working-directory: ./patientor-tests
      run: pnpm install 

    - name: Install Playwright browsers
      working-directory: ./patientor-tests
      run: pnx playwright install --with-deps chromium

    - name: Wait for servers to start
      run: pnx wait-on http://localhost:3001/api/ping http://localhost:5173 --timeout 60000

    - name: Run E2E tests
      working-directory: ./patientor-tests
      run: pnpm test

    - name: Upload test report
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: playwright-report
        path: patientor-tests/playwright-report/
        retention-days: 30
